# CI do PwnCheck: lint, formatação, testes e scans de segurança a cada push/PR na main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Botão "Run workflow" na aba Actions: roda o CI na hora, sem precisar de um push.
  workflow_dispatch:

# Menor privilégio: o token do workflow só pode LER o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Um PostgreSQL de verdade para os testes do cache (fase 3), num container ao lado do job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pwncheck_test
          POSTGRES_USER: pwncheck
          POSTGRES_PASSWORD: ci-only-password   # banco descartável, só existe durante o job
        ports:
          - 5432:5432
        # O job só começa quando o banco aceita conexões.
        options: >-
          --health-cmd "pg_isready -U pwncheck -d pwncheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://pwncheck:ci-only-password@localhost:5432/pwncheck_test
      # No CI, teste de banco que seria PULADO vira FALHA: não queremos um verde mentiroso.
      PWNCHECK_REQUIRE_DB: "1"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências (execução + desenvolvimento)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest -q -rs

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de segurança
        run: pip install pip-audit bandit

      # Os scans BLOQUEIAM o CI: o projeto é pequeno e novo, então uma vulnerabilidade
      # nova numa dependência deve ser tratada na hora.
      - name: Scan de vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança (bandit)
        run: bandit -r app -ll
