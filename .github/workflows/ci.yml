# CI do PwnCheck: lint, formatação, testes e scans de segurança a cada push/PR na main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Botão "Run workflow" na aba Actions: roda o CI na hora, sem precisar de um push.
  workflow_dispatch:

# Menor privilégio: o token do workflow só pode LER o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Um PostgreSQL de verdade para os testes do cache (fase 3), num container ao lado do job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pwncheck_test
          POSTGRES_USER: pwncheck
          POSTGRES_PASSWORD: ci-only-password   # banco descartável, só existe durante o job
        ports:
          - 5432:5432
        # O job só começa quando o banco aceita conexões.
        options: >-
          --health-cmd "pg_isready -U pwncheck -d pwncheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://pwncheck:ci-only-password@localhost:5432/pwncheck_test
      # No CI, teste de banco que seria PULADO vira FALHA: não queremos um verde mentiroso.
      PWNCHECK_REQUIRE_DB: "1"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências (execução + desenvolvimento)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest -q -rs

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de segurança
        run: pip install pip-audit bandit

      # Os scans BLOQUEIAM o CI: o projeto é pequeno e novo, então uma vulnerabilidade
      # nova numa dependência deve ser tratada na hora.
      - name: Scan de vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança (bandit)
        run: bandit -r app -ll

  # Fase 6: constrói a imagem e sobe a stack de PRODUÇÃO inteira (banco, migrações, aplicação
  # e Caddy com HTTPS), como no servidor. Pega erros de Dockerfile, de compose e de Caddyfile.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      # Segredos aleatórios e descartáveis: existem só durante o job. DOMAIN=localhost faz o
      # Caddy usar a própria CA local (não há DNS público para o Let's Encrypt aqui).
      - name: Criar o .env de teste
        run: |
          PW=$(openssl rand -hex 24)
          cat > .env <<EOF
          POSTGRES_DB=pwncheck
          POSTGRES_USER=pwncheck
          POSTGRES_PASSWORD=$PW
          DATABASE_URL=postgresql+psycopg://pwncheck:$PW@pwncheck-db:5432/pwncheck
          JWT_SECRET=$(openssl rand -hex 32)
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          EOF

      - name: Subir a stack de produção (build, migrações, aplicação e Caddy)
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Teste de fumaça por HTTPS
        run: |
          curl -fsk https://localhost/health
          curl -sk -D - -o /dev/null https://localhost/health | grep -i "strict-transport-security"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health)" = "308"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/check \
            -H 'content-type: application/json' -d '{"password":"x"}')" = "401"

      - name: Logs dos containers (só se algo falhou)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
