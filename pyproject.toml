# Configuração das ferramentas de qualidade (lint e testes).
# O pyproject.toml é o arquivo de configuração padrão de projetos Python —
# cada ferramenta lê a sua seção [tool.<nome>].

[tool.ruff]
line-length = 100
target-version = "py312"
# O ruff também formata blocos de código dentro de arquivos Markdown. As lições em docs/
# têm trechos didáticos (recortes, comentários alinhados): ficam fora do lint e do format.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/W = estilo (pycodestyle) · F = erros reais (pyflakes)
# I = ordenação de imports · B = bugs comuns (bugbear) · S = segurança (bandit)
select = ["E", "W", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Em testes, o uso de "assert" é esperado (S101), e senhas escritas no código
# (S105/S106) são dados de teste de propósito — em app/ as regras continuam valendo.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Alembic (migrações do banco). A configuração mora aqui, junto com a das outras
# ferramentas; não há alembic.ini. A URL do banco NÃO fica aqui: o migrations/env.py a lê
# das variáveis de ambiente (ela contém a senha).
[tool.alembic]
script_location = "%(here)s/migrations"
# Nomes dos arquivos: 0001_create_prefix_cache.py (o número vem de --rev-id).
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Depois de gerar uma migração, formata e corrige o arquivo com o ruff ("python -m ruff").
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
